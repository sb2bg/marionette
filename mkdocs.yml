site_name: Marionette
site_description: Deterministic I/O and simulation testing for Zig.
site_url: https://sb2bg.github.io/marionette/
repo_url: https://github.com/sb2bg/marionette
repo_name: sb2bg/marionette

theme:
  name: material
  palette:
    scheme: default
    primary: black
    accent: indigo
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences

exclude_docs: |
  requirements.txt

nav:
  - Home: index.md
  - Blog:
      - blog/index.md
      - Our tests only passed because of register allocation luck: blog/our-tests-only-passed-because-of-register-allocation-luck.md
      - A graceful shutdown that only worked because of thread preemption: blog/a-graceful-shutdown-that-only-worked-because-of-thread-preemption.md
  - Docs:
      - Architecture: architecture.md
      - Run: run.md
      - API: api.md
      - Examples: examples.md
      - Determinism: determinism.md
      - Trace Format: trace-format.md
      - BUGGIFY: buggify.md
      - Network Model: network.md
      - std.Io.net Conformance: std-io-net-conformance.md
      - std.Io.net Client/Server Example: std-io-net-example.md
      - Disk Fault Model: disk-fault-model.md
      - Roadmap: roadmap.md
      - Releasing: releasing.md

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Zig build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: zig build

  test:
    name: Zig test (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        optimize:
          - Debug
          - ReleaseSafe
          - ReleaseFast

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Test
        run: zig build test -Doptimize=${{ matrix.optimize }} --test-timeout 5m

  external-validation:
    name: ${{ matrix.target }} (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - validate-xitdb
          - validate-mailbox
          - validate-ochi
          - validate-dusty
          - validate-beanstalkz
        optimize:
          - Debug
          - ReleaseSafe
          - ReleaseFast

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Validate
        run: zig build ${{ matrix.target }} -Doptimize=${{ matrix.optimize }} --test-timeout 5m

  macos-test:
    name: macOS test (${{ matrix.optimize }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        optimize:
          - Debug
          - ReleaseSafe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Test
        run: zig build test -Doptimize=${{ matrix.optimize }} --test-timeout 5m

  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Compile disabled Win64 fiber path
        run: zig test src/fiber.zig -target x86_64-windows-gnu -OReleaseSafe -fno-emit-bin

      - name: Check release symbols
        run: zig build check-release-symbols
